<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080808;
    --bg2: #0e0e0e;
    --card: #111111;
    --border: rgba(255, 255, 255, 0.1);
    --accent: #ffffff;
    --accent-soft: rgba(255, 255, 255, 0.12);
    --white: #f5f5f5;
    --muted: rgba(245, 245, 245, 0.4);
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-body);
    font-weight: 300;
    overflow-x: hidden;
    cursor: default;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  /* ── SECTIONS ── */
  section {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  /* ── HERO ── */
  #hero { text-align: center; gap: 48px; }

  .hero-eyebrow {
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    opacity: 0;
    animation: fadeUp 0.9s 0.2s ease forwards;
  }

  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    font-weight: 300;
    line-height: 1.15;
    color: var(--white);
    opacity: 0;
    animation: fadeUp 1s 0.45s ease forwards;
  }

  .hero-title em {
    font-style: italic;
    color: rgba(255,255,255,0.6);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 36px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 100px;
    color: var(--white);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.35s ease;
    opacity: 0;
    animation: fadeUp 1s 0.75s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .btn-primary:hover {
    border-color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.06);
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(255,255,255,0.05);
  }

  .scroll-hint {
    position: absolute;
    bottom: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(1); }
    50% { opacity: 0.9; transform: scaleY(1.1); }
  }

  /* ── SECTION LABELS ── */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    text-align: center;
  }

  /* ── PHOTOS ── */
  #photos {
    gap: 48px;
    padding: 80px 24px;
    min-height: auto;
  }

  .photos-header { text-align: center; }

  .photos-title {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 300;
    color: var(--white);
    margin-top: 12px;
    font-style: italic;
  }

  .photos-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }

  .photo-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    aspect-ratio: 4/5;
    background: var(--card);
    cursor: pointer;
    transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s;
  }

  .photo-item:first-child {
    grid-column: 1 / -1;
    aspect-ratio: 16/10;
  }

  .photo-item:hover {
    transform: scale(1.02);
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    z-index: 2;
  }

  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(100%) contrast(1.05);
    transition: filter 0.5s ease, transform 0.5s ease;
  }

  .photo-item:hover img {
    filter: grayscale(80%) contrast(1.08);
    transform: scale(1.04);
  }

  .photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.3) 0%, transparent 50%);
    pointer-events: none;
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(8px);
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    filter: grayscale(100%) contrast(1.05);
    animation: fadeIn 0.3s ease;
  }

  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    font-size: 20px;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }

  .lightbox-close:hover { background: rgba(255,255,255,0.1); }

  /* ── COUNTER ── */
  #counter {
    gap: 56px;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }

  .counter-caption {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 300;
    font-style: italic;
    color: var(--muted);
    text-align: center;
    max-width: 480px;
    line-height: 1.5;
  }

  .counter-grid {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .counter-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 32px;
    min-width: 110px;
    text-align: center;
    transition: border-color 0.3s, transform 0.3s;
  }

  .counter-block:hover {
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-3px);
  }

  .counter-num {
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 8vw, 4rem);
    font-weight: 300;
    color: var(--white);
    line-height: 1;
    display: block;
    letter-spacing: -0.02em;
  }

  .counter-sep {
    font-size: 2.5rem;
    color: rgba(255,255,255,0.2);
    line-height: 1;
    padding-bottom: 20px;
    align-self: flex-end;
  }

  .counter-unit {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 8px;
    display: block;
  }

  /* ── PHRASES ── */
  #phrases { gap: 48px; }

  .phrases-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 56px 48px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .phrases-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }

  .phrases-card:hover { border-color: rgba(255,255,255,0.2); }

  .phrase-text {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    font-weight: 300;
    font-style: italic;
    line-height: 1.4;
    color: var(--white);
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .phrase-text.fade-out { opacity: 0; transform: translateY(8px); }
  .phrase-text.fade-in  { opacity: 1; transform: translateY(0); }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 40px;
  }

  .btn-ghost:hover {
    border-color: rgba(255,255,255,0.3);
    color: var(--white);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }

  /* ── PLAYLIST ── */
  #playlist {
    gap: 48px;
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
  }

  .playlist-title {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 300;
    color: var(--white);
    margin-top: 12px;
    text-align: center;
  }

  .tracks-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 580px;
  }

  .track-embed {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    background: var(--card);
  }

  .track-embed:hover {
    border-color: rgba(255,255,255,0.2);
    transform: translateX(4px);
    box-shadow: -4px 0 20px rgba(255,255,255,0.04);
  }

  .track-embed iframe {
    display: block;
    width: 100%;
    border: none;
  }

  .track-hint {
    padding: 6px 16px 10px;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .footer-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }

  .footer-text {
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    font-style: italic;
    font-weight: 300;
    color: var(--muted);
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    .counter-grid { gap: 8px; }
    .counter-block { min-width: 90px; padding: 22px 20px; }
    .phrases-card { padding: 40px 28px; }
    .photos-grid { gap: 8px; }
  }
</style>
</head>
<body>

<!-- ── LIGHTBOX ── -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- ── HERO ── -->
<section id="hero">

<!-- ── PHOTOS ── -->
<section id="photos">
  <div class="photos-header reveal">

  </div>
  <div class="photos-grid reveal">

      <img src="https://i.postimg.cc/bw6jDf65/Whats-App-Image-2026-08-11-at-13-20-57-(3).jpg" alt="" loading="lazy">
      <div class="photo-overlay"></div>
    </div>
    <div class="photo-item" onclick="openLightbox('https://i.postimg.cc/2ydsCsbG/Whats-App-Image-2026-08-11-at-13-20-57-(4).jpg')">
      <img src="https://i.postimg.cc/2ydsCsbG/Whats-App-Image-2026-08-11-at-13-20-57-(4).jpg" alt="" loading="lazy">
      <div class="photo-overlay"></div>
    </div>
  </div>
</section>

<!-- ── COUNTER ── -->
<section id="counter">
  <p class="section-label reveal">tempo</p>
  <p class="counter-caption reveal">desde o dia que a gente se viu pela primeira vez</p>
  <div class="counter-grid reveal">
    <div class="counter-block">
      <span class="counter-num" id="days">0</span>
      <span class="counter-unit">dias</span>
    </div>
    <span class="counter-sep">·</span>
    <div class="counter-block">
      <span class="counter-num" id="hours">00</span>
      <span class="counter-unit">horas</span>
    </div>
    <span class="counter-sep">·</span>
    <div class="counter-block">
      <span class="counter-num" id="minutes">00</span>
      <span class="counter-unit">minutos</span>
    </div>
  </div>
</section>


<!-- ── PLAYLIST ── -->
<section id="playlist">
  <div class="reveal" style="text-align:center;">
    <p class="section-label">playlist</p>
    <h2 class="playlist-title">umas músicas que me lembram você</h2>
  </div>

  <div class="tracks-grid reveal">
    <div class="track-embed">
      <iframe src="https://open.spotify.com/embed/track/3EBtHRt4uSSFhNladqH3UP?utm_source=generator&theme=0"

    </div>
    <div class="track-embed">
      <iframe src="https://open.spotify.com/embed/track/32ePhN7OPZpnBQ7XrJWR1l?utm_source=generator&theme=0"

    </div>
    <div class="track-embed">
      <iframe src="https://open.spotify.com/embed/track/15iCEgTo4luXR9ZtefjvYk?utm_source=generator&theme=0"
        height="80" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
    <div class="track-embed">
      <iframe src="https://open.spotify.com/embed/track/4woTEX1wYOTGDqNXuavlRC?utm_source=generator&theme=0"
        height="80" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
    <div class="track-embed">
      <iframe src="https://open.spotify.com/embed/track/40Fu5zvEGp1vyTFPksatVo?utm_source=generator&theme=0"
        height="80" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
    <div class="track-embed">
      <iframe src="https://open.spotify.com/embed/track/1TtLh08uibteeML3FoMiBF?utm_source=generator&theme=0"
        height="80" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

      <iframe src="https://open.spotify.com/embed/track/4d0DpU7Odiv0ztvX2GxJlk?utm_source=generator&theme=0"

</section>

<!-- ── FOOTER ── -->
<footer>
  <div class="footer-line"></div>
  <p class="footer-text">é isso… só queria fazer algo diferente 🙂</p>
  <div class="footer-line"></div>
</footer>

<script>
  function openSite() {
    const landing = document.getElementById('landing');
    landing.style.opacity = '0';
    landing.style.transform = 'translateY(-12px)';
    landing.style.transition = 'all 0.5s ease';
    setTimeout(() => {
      landing.style.display = 'none';
      const hint = document.getElementById('scrollHint');
      hint.style.display = 'flex';
      hint.style.opacity = '0';
      setTimeout(() => {
        hint.style.transition = 'opacity 0.8s ease';
        hint.style.opacity = '1';
      }, 100);
      setTimeout(() => {
        document.getElementById('photos').scrollIntoView({ behavior: 'smooth' });
      }, 600);
    }, 500);
  }

  // Lightbox
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  // Counter
  const startDate = new Date('2026-02-20T00:00:00');
  function updateCounter() {
    const diff = new Date() - startDate;
    if (diff < 0) return;
    document.getElementById('days').textContent    = Math.floor(diff / 86400000);
    document.getElementById('hours').textContent   = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
    document.getElementById('minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
  }
  updateCounter();
  setInterval(updateCounter, 10000);

  
  

  // Scroll reveal
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const delay = e.target.dataset.delay || 0;
        setTimeout(() => e.target.classList.add('visible'), delay);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.dataset.delay = (i % 4) * 120;
    observer.observe(el);
  });
</script>
</body>
</html>
